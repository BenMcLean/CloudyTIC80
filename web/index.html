<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CloudyTIC80</title>
<style>
  html, body { margin: 0; padding: 0; background: #140c1c; height: 100%; overflow: hidden; }
  .game { width: 100vw; height: 100vh; }
  #canvas { display: block; width: 100%; height: 100%; margin: 0 auto; outline: none; image-rendering: pixelated; }
  /* Required by TIC-80's compiled console `add` command (Module.showAddPopup,
     baked into tic80.js from upstream's build/html/prejs.js) - it looks up
     these elements by id/class directly and throws if they're missing. */
  .modal { display: none; position: fixed; z-index: 1; padding-top: 100px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0, 0, 0, .4); }
  .modal-content { color: #333c57; position: relative; background-color: #fefefe; margin: auto; padding: 2px 16px; border: 1px solid #888; width: 500px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, .2), 0 6px 20px 0 rgba(0, 0, 0, .19); }
  .close { color: #000; float: right; font-size: 28px; font-weight: 700; }
  .close:focus, .close:hover { color: #000; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<div class="game">
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>
<div id="add-modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <p>Select a file to add to the computer</p>
    <p><input type="file" id="upload-input"></p>
  </div>
</div>
<script src="webdav-shim.js"></script>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
    preRun: [],
  };
  CloudyTIC80Shim.install(Module);
</script>
<script src="tic80.js"></script>
</body>
</html>
