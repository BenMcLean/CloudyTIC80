version: 2
updates:
  # The actions used by .github/workflows (checkout, buildx, setup-node, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Playwright and friends, in tests/.
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
    groups:
      test-deps:
        patterns: ["*"]

  # The literal FROM lines in the Dockerfile (emsdk, webdav, linuxserver Alpine base).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
