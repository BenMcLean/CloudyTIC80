name: Build, test, then publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io

# One job, so one build: the image is built once, the tests run against that very image, and
# the publish step at the end only runs if they passed. (The publish step's build is
# the same Dockerfile against the same layer cache, so the expensive TIC-80 compile is not
# repeated - only the arm64 final stage is new, and only on tags.) The tests run on amd64
# only: they check the site's behaviour, and the TIC-80 WASM is the same bytes on every
# architecture (the Dockerfile builds it on amd64 regardless of target).
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires lowercase image names; github.repository preserves the
      # repo's actual casing (CloudyTIC80).
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Only needed to cross-build linux/arm64 on the amd64 runner; skipped when
      # we're only building amd64 (a plain push to master), since it's not free.
      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- build once, test that image ---------------------------------------------------

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cloudytic80:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container with test accounts
        run: |
          mkdir -p "$RUNNER_TEMP/cfg"
          cp tests/webdav-config.test.yml "$RUNNER_TEMP/cfg/webdav-config.yml"
          docker run -d --name ct80test -p 8080:80 -v "$RUNNER_TEMP/cfg:/config" cloudytic80:test
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ct80test)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs ct80test
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: tests
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results/

      - name: Container logs
        if: failure()
        run: docker logs ct80test

      # --- publish: only reached if every step above succeeded ---------------------------

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build platforms
        id: platforms
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Publish (same build, from cache)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
