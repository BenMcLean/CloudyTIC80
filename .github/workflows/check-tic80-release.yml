name: Check for a new TIC-80 release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # Opens an issue (not a PR: a PR made with GITHUB_TOKEN does not trigger the build/test
      # workflow, so it would look green without having been tested).
      - name: Compare pinned version with latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG TIC80_VERSION=//p' Dockerfile)
          # The latest published GitHub Release (never a draft, prerelease, bare tag or commit).
          latest=$(gh api repos/nesbox/TIC-80/releases/latest --jq .tag_name)
          printf '%s' "$latest" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "unexpected release tag: '$latest'" >&2; exit 1; }
          echo "pinned=$pinned latest=$latest"
          [ "$pinned" = "$latest" ] && exit 0
          # Only nag when upstream is actually newer (the pin may be a SHA or a newer snapshot).
          [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)" = "$latest" ] || exit 0
          title="TIC-80 $latest is available (pinned: $pinned)"
          existing=$(gh issue list --state all --search "in:title \"$title\"" --json title --jq '.[].title' | grep -Fx "$title" || true)
          [ -z "$existing" ] || exit 0
          gh issue create --title "$title" --body "Upstream released $latest. Bump \`ARG TIC80_VERSION\` in the Dockerfile, run the smoke test described there, then tag a release."
