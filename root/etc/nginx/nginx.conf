# Master stays root (standard nginx privilege-separation model) so it can freely open
# /dev/stdout/stderr and bind port 80; workers drop to `abc` via the `user` directive,
# inheriting the already-open log file descriptors from master - no separate permission
# dance needed for a non-root worker to write logs.
user abc;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # Route through `docker logs` instead of accumulating as files in the
    # container's writable layer, which nothing rotates.
    access_log /dev/stdout;
    include /etc/nginx/http.d/*.conf;
}
