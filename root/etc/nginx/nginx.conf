# Master stays root (standard nginx privilege-separation model) so it can freely open
# /dev/stdout/stderr and bind port 80; workers drop to `abc` via the `user` directive,
# inheriting the already-open log file descriptors from master - no separate permission
# dance needed for a non-root worker to write logs.
user abc;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # Route through `docker logs` instead of accumulating as files in the
    # container's writable layer, which nothing rotates.
    # The $loggable map comes from /run/log-filter.conf, which svc-nginx/run
    # writes at startup from LOG_LEVEL: only failures (4xx/5xx, e.g. bad
    # logins) by default, everything with LOG_LEVEL=verbose.
    include /run/log-filter.conf;
    access_log /dev/stdout combined if=$loggable;
    # Throttles failed logins only (see @unauthorized in http.d/default.conf):
    # 10 a minute per client address, burst of 10, then HTTP 429. Behind a
    # reverse proxy every user shares the proxy's address unless nginx's
    # real_ip module is configured.
    limit_req_zone $binary_remote_addr zone=authfail:1m rate=10r/m;
    limit_req_status 429;
    include /etc/nginx/http.d/*.conf;
}
