server {
    listen 80;
    server_name _;

    auth_basic "CloudyTIC80";
    auth_basic_user_file /config/htpasswd;

    # Failed logins are handed to @unauthorized, which throttles them per
    # client address (see limit_req_zone in nginx.conf). Successful requests
    # never pass through it, so page and asset loads aren't limited.
    #
    # Two details that each silently break this if missed: auth_basic is
    # inherited by the named location and must be switched off there, or it
    # fails a second time; and the reply can't use "return", which runs in the
    # rewrite phase before limit_req, so try_files is used instead.
    error_page 401 = @unauthorized;
    location @unauthorized {
        internal;
        auth_basic off;
        root /app/www;
        limit_req zone=authfail burst=10 nodelay;
        try_files /nonexistent =401;
    }

    # Excluded so the browser tab icon doesn't trigger a spurious 401.
    location = /favicon.ico {
        root /app/www;
        auth_basic off;
    }

    # The server owner's TIC-80 option settings (optional; see README). Behind the same login
    # as everything else, and never cached, so an edit applies on the next page load.
    location = /tic80-options.json {
        alias /config/tic80-options.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        root /app/www;
        try_files $uri /index.html;
    }

    # TIC-80's own "surf"/export network calls use relative paths (/json, /cart/,
    # /export/, /js/). webdav-shim.js redirects those straight from the browser to
    # tic80.com, so none of that traffic goes through this server.

    location /dav/ {
        proxy_pass http://127.0.0.1:6065/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Authorization header is forwarded by default - webdav re-validates the same
        # credentials against webdav-config.yml for per-user folder scoping.
        client_max_body_size 0;
    }
}
