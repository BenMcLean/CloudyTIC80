server {
    listen 80;
    server_name _;

    auth_basic "CloudyTIC80";
    auth_basic_user_file /config/htpasswd;

    # Excluded so the browser tab icon doesn't trigger a spurious 401.
    location = /favicon.ico {
        root /app/www;
        auth_basic off;
    }

    location / {
        root /app/www;
        try_files $uri /index.html;
    }

    # TIC-80's own "surf"/export network calls (fs.c, surf.c, console.c) are compiled
    # to hit these paths as *relative* fetches - fine when TIC-80 is served from
    # tic80.com itself, but here they'd otherwise resolve against our own origin
    # instead of reaching the real site. Proxy them through so surf's online carts
    # folder (and web-export) work the same as upstream.
    location ~ ^/(json|cart/|export/|js/) {
        proxy_pass https://tic80.com;
        proxy_set_header Host tic80.com;
        proxy_ssl_server_name on;
    }

    location /dav/ {
        proxy_pass http://127.0.0.1:6065/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Authorization header is forwarded by default - webdav re-validates the same
        # credentials against webdav-config.yml for per-user folder scoping.
        client_max_body_size 0;
    }
}
