# CloudyTIC80 user accounts.
#
# Edit this file (mounted at /config/webdav-config.yml on the host) to add, remove, or
# change users, then restart the container. Passwords may be plain text (fast setup and
# testing) or bcrypt-hashed (better security) - either way keep this file's permissions
# private, and always run this container behind HTTPS/TLS, since Basic Auth sends
# credentials on every request.
#
# To use a bcrypt hash, generate one and put it in quotes with a "{bcrypt}" prefix:
#   docker run --rm httpd:2-alpine htpasswd -nbBC 10 "" 'mypassword' | cut -d: -f2
#   password: "{bcrypt}$2y$10$...."
# The quotes are required (YAML would read a bare "{" as the start of a map). Plain and
# hashed users can be mixed freely in the same file.
#
# Both nginx (whole-site login) and webdav (per-user folder scoping) read their
# credentials from this one file - nginx's htpasswd is regenerated from it automatically
# on every container start.
#
# With no users configured, nobody can log in at all (nginx and webdav both deny every
# request) - this is safe but unusable until you add at least one user.
#
# To add a user, uncomment the "users:" key and the template entry below it, then edit
# the username, password, and directory. To add further users, add more entries (each
# starting with "- username:") under the same "users:" key - don't repeat the "users:"
# key itself, it's a single list.
address: 127.0.0.1
port: 6065
directory: /config/data
permissions: none
cors:
  enabled: false
# users:
#   - username: alice
#     password: changeme
#     directory: /config/data/alice
#     permissions: CRUD
#   - username: bob
#     password: changeme
#     directory: /config/data/bob
#     permissions: CRUD
