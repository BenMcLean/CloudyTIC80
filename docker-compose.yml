services:
  cloudytic80:
    image: ghcr.io/benmclean/cloudytic80:latest
    container_name: cloudytic80
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ${CONFIG_DIR:-./config}:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
